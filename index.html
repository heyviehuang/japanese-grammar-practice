<!DOCTYPE html>
<html lang="zh-Hant">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>日文文法筆記</title>
    <link rel="icon" type="image/png" href="Japanese/grammar-icon.png">
    <link rel="apple-touch-icon" href="Japanese/grammar-icon.png">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
    <style>
      :root {
        color-scheme: light;
        --paper: #e8efec;
        --card: #f8fbf8;
        --ink: #26352f;
        --sub: #566960;
        --line: #d7e3dd;
        --indigo: #6d9188;
        --seal: #c98279;
        --ok: #5c907b;
        --w1: #f8d6d6;
        --w2: #fbe3c4;
        --w3: #e2dcf3;
        --veil: rgba(223, 234, 230, .20);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px)
      }


      *,
      *::before,
      *::after {
        box-sizing: inherit
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px)
      }

      body {
        margin: 0;
        background: linear-gradient(var(--veil), var(--veil)), url('https://i.pinimg.com/736x/65/69/4f/65694f7cabaa8c0e73f5e8ad018c48cc.jpg') center/cover no-repeat var(--paper);
        background-attachment: fixed;
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        line-height: 1.6;
        min-height: 100vh
      }

      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 18px 40px
      }

      h1 {
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Noto Serif TC", serif;
        font-size: 2rem;
        margin: 8px 0 4px;
        letter-spacing: .04em
      }

      p.lead {
        color: var(--ink);
        margin: 0 0 22px
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0 22px
      }

      .chip {
        border: 1px solid rgba(255, 255, 255, .85);
        background: rgba(255, 255, 255, .55);
        color: var(--ink);
        padding: 8px 18px;
        border-radius: 9px;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(90, 110, 120, .12)
      }

      .chip[aria-pressed="true"] {
        border-color: transparent;
        background: linear-gradient(135deg, #f6c3a6, #f3a9b4);
        color: var(--ink);
        font-weight: 500
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--indigo);
        outline-offset: 2px
      }

      .btn {
        background: linear-gradient(135deg, #f6c3a6, #f3a9b4);
        color: var(--ink);
        border: 0;
        border-radius: 9px;
        padding: 12px 26px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(200, 110, 110, .25)
      }

      .btn:active {
        transform: scale(.98)
      }

      .btn.ghost {
        background: rgba(255, 255, 255, .5);
        color: var(--ink);
        border: 1px solid rgba(255, 255, 255, .85);
        box-shadow: none
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--ink);
        font-size: .95rem;
        margin-bottom: 8px
      }

      .bar {
        height: 8px;
        background: rgba(255, 255, 255, .55);
        border-radius: 9px;
        overflow: hidden;
        margin-bottom: 18px
      }

      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #f3b79f, #9fc3d6);
        border-radius: 9px;
        transition: width .3s
      }

      .card,
      #home,
      #end {
        background: color-mix(in srgb, var(--card) 78%, transparent);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, .7);
        border-radius: 9px;
        padding: 24px 22px;
        position: relative;
        box-shadow: 0 10px 32px rgba(80, 100, 110, .16)
      }

      .word {
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Noto Serif TC", serif;
        font-size: 2.6rem;
        font-weight: 700;
        line-height: 1.2;
        margin: 0
      }

      .kana {
        color: var(--sub);
        margin: 2px 0 0
      }

      .mean {
        color: var(--sub);
        font-size: .95rem
      }

      .target {
        margin: 16px 0 12px;
        font-size: 1.1rem
      }

      .target b {
        background: linear-gradient(transparent 58%, rgba(246, 180, 150, .7) 58%);
        padding: 0 2px
      }

      .row {
        display: flex;
        gap: 8px
      }

      input[type=text] {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 1.3rem;
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, .9);
        border-radius: 9px;
        background: rgba(255, 255, 255, .7);
        box-shadow: inset 0 1px 4px rgba(90, 110, 120, .14);
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif
      }

      .fb {
        margin-top: 16px;
        display: none
      }

      .fb.show {
        display: block
      }

      .stamp {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 64px;
        height: 60px;
        background: rgba(240, 160, 140, .75);
        color: #7a2a1e;
        border-radius: 58% 42% 55% 45%/50% 55% 45% 50%;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 1.2rem;
        transform: rotate(-10deg)
      }

      .stamp.ok {
        background: rgba(160, 208, 184, .8);
        color: #1d5a40
      }

      .stamp.show {
        display: flex;
        animation: press .18s ease-out
      }

      @keyframes press {
        from {
          transform: rotate(-10deg) scale(1.7);
          opacity: 0
        }

        to {
          transform: rotate(-10deg) scale(1);
          opacity: 1
        }
      }

      .ans {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 4px
      }

      .rule {
        color: var(--sub);
        margin: 0 0 12px
      }

      .big {
        font-family: "Shippori Mincho", serif;
        font-size: 3.2rem;
        font-weight: 700;
        margin: 6px 0
      }

      .rev {
        list-style: none;
        padding: 0;
        margin: 14px 0
      }

      .rev li {
        padding: 10px 0;
        border-top: 1px solid var(--line)
      }

      .rev small {
        color: var(--sub);
        display: block
      }

      .shake {
        animation: sh .3s
      }

      @keyframes sh {
        25% {
          transform: translateX(-6px)
        }

        75% {
          transform: translateX(6px)
        }
      }

      @media (prefers-reduced-motion:reduce) {

        .stamp.show,
        .shake {
          animation: none
        }

        .bar i {
          transition: none
        }
      }



      /* 水彩花朵背景搭配：霧藍綠 × 奶油白 × 柔珊瑚 */
      main {
        max-width: 560px;
        padding: 34px 20px 48px;
      }

      h1 {
        color: #263f36;
        font-size: clamp(1.75rem, 5vw, 2.1rem);
        letter-spacing: .07em;
      }

      p.lead {
        color: #465d53;
      }

      #home,
      #end,
      .card {
        background: rgba(250, 253, 250, .78);
        border: 1px solid rgba(255, 255, 255, .82);
        border-radius: 22px;
        box-shadow: 0 16px 42px rgba(71, 103, 93, .13), inset 0 1px 0 rgba(255, 255, 255, .72);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }

      #home,
      #end {
        padding: 28px 26px;
      }

      .chip {
        border: 1px solid rgba(255, 255, 255, .9);
        background: rgba(249, 252, 249, .72);
        color: #344b40;
        border-radius: 999px;
        padding: 9px 17px;
        box-shadow: 0 3px 12px rgba(75, 110, 99, .08);
        transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      }

      .chip:hover {
        transform: none;
      }

      .chip[aria-pressed="true"] {
        background: linear-gradient(135deg, #d7e9e1, #f4dcd5);
        color: #263f36;
        border-color: rgba(255, 255, 255, .9);
        box-shadow: 0 5px 14px rgba(103, 145, 130, .16);
      }

      .btn {
        border-radius: 999px;
        padding: 11px 24px;
        color: #293f35;
        background: linear-gradient(135deg, #d7e9e1, #f1d9d2);
        box-shadow: 0 6px 16px rgba(104, 145, 130, .17);
        transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(104, 145, 130, .22);
        filter: saturate(1.04);
      }

      .btn:active {
        transform: translateY(0) scale(.98);
      }

      .btn.ghost {
        background: rgba(255, 255, 255, .72);
        color: #40584d;
        border-color: rgba(255, 255, 255, .9);
      }

      .hud {
        color: #3d554a;
        font-size: .9rem;
      }

      .bar {
        height: 7px;
        background: rgba(255, 255, 255, .72);
        border-radius: 99px;
      }

      .bar i {
        background: linear-gradient(90deg, #a9cdbd, #e9bdb2);
        border-radius: 99px;
      }

      .word {
        color: #263f36;
      }

      .kana,
      .mean {
        color: #596d63;
      }

      .target b {
        background: linear-gradient(transparent 60%, rgba(225, 190, 177, .62) 60%);
      }

      input[type=text] {
        border: 1px solid rgba(255, 255, 255, .96);
        border-radius: 14px;
        background: rgba(255, 255, 255, .78);
        box-shadow: inset 0 1px 4px rgba(80, 115, 102, .08);
      }

      input[type=text]:focus {
        border-color: #a7c8b9;
        background: rgba(255, 255, 255, .94);
      }

      .stamp {
        background: rgba(231, 190, 178, .9);
        color: #87564c;
        transform: rotate(-7deg);
      }

      .stamp.ok {
        background: rgba(182, 215, 198, .94);
        color: #426c59;
      }

      .stamp.show {
        animation: press .18s ease-out;
      }

      .ans {
        color: #456258;
      }

      .rule {
        color: #596d63;
      }

      .rev li {
        border-color: rgba(135, 164, 151, .22);
      }

      .rev small {
        color: #596d63;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(109, 145, 136, .55);
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        main {
          padding: 22px 14px 34px;
        }

        #home,
        #end,
        .card {
          padding: 22px 18px;
          border-radius: 19px;
        }

        .row {
          align-items: stretch;
        }

        .row .btn {
          padding-left: 18px;
          padding-right: 18px;
        }
      }

      [hidden] {
        display: none !important
      }

      .data-status {
        margin: 12px 0;
        padding: 12px 14px;
        border: 1px solid rgba(135, 164, 151, .3);
        border-radius: 12px;
        background: rgba(248, 251, 248, .82);
        color: var(--sub);
      }

      .data-status.error {
        color: #8a514b;
        border-color: rgba(176, 109, 99, .4);
      }

      /* Dictionary-form study table */
      .study-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 22px 60px;
      }

      .study-head {
        margin: 14px 0 24px;
      }

      .study-head h1 {
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }

      .study-head p {
        color: var(--sub);
        margin: 8px 0 0;
      }

      .study-panel {
        background: color-mix(in srgb, var(--card) 86%, transparent);
        border: 1px solid rgba(255, 255, 255, .8);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 10px 32px rgba(80, 100, 110, .12);
      }

      .category-title {
        font-size: 1.05rem;
        margin: 0 0 10px;
        color: var(--ink);
      }

      .category-tabs {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        margin-bottom: 18px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x;
        scrollbar-width: none;
      }

      .category-tabs::-webkit-scrollbar {
        display: none;
      }

      .category-tabs .chip {
        flex: 0 0 auto;
      }

      .category-tabs .chip {
        border-radius: 999px;
        color: #344b40;
        font-weight: 700;
        font-size: .88rem;
        padding: 6px 12px;
        white-space: nowrap;
      }

      .table-scroll-tools {
        position: sticky;
        top: 8px;
        z-index: 8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 8px;
        padding: 6px 8px;
        border: 1px solid rgba(255, 255, 255, .78);
        border-radius: 12px;
        background: rgba(248, 251, 248, .9);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }

      .table-scroll-label {
        color: var(--sub);
        font-size: .86rem;
      }

      .table-scroll-buttons {
        display: flex;
        gap: 6px;
      }

      .scroll-control {
        min-width: 42px;
        padding: 4px 10px !important;
        font-size: 1.15rem;
        line-height: 1.3;
      }

      .table-scroll {
        display: block;
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        border-radius: 14px;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
        scrollbar-width: thin;
        scrollbar-color: #9bb9aa transparent;
      }

      .study-table {
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        width: 100%;
        min-width: 1610px;
        background: rgba(255, 255, 255, .5);
      }

      .study-table col:first-child {
        width: 170px;
      }

      .study-table col:not(:first-child) {
        width: 180px;
      }

      .study-table th,
      .study-table td {
        padding: 12px 10px;
        text-align: center;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .study-table th {
        background: rgba(220, 235, 228, .72);
        font-weight: 700;
        white-space: normal;
        line-height: 1.35;
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .study-table th:first-child,
      .study-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        background: rgba(248, 251, 248, .97);
        text-align: center;
        min-width: 150px;
      }

      .study-table th:first-child {
        z-index: 5;
        position: sticky;
        left: 0;
        background: #e1eee8;
      }

      .study-table td:first-child {
        z-index: 3;
      }

      .study-table tr:first-child th {
        border-top: 1px solid var(--line);
      }

      .study-table th:first-child,
      .study-table td:first-child {
        border-left: 1px solid var(--line);
      }

      .cell-button {
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        padding: 5px 7px;
        border-radius: 8px;
        min-width: 112px;
      }

      .cell-button:hover {
        background: rgba(215, 233, 225, .7);
      }

      .cell-button .masked {
        color: #84938b;
        letter-spacing: .08em;
      }

      .speaker,
      .column-speaker {
        border: 0;
        background: transparent;
        color: var(--indigo);
        font: inherit;
        cursor: pointer;
        padding: 4px 7px;
        margin-left: 3px;
        border-radius: 8px;
      }

      .study-table td:first-child {
        position: sticky;
      }

      .study-table td:first-child .row-word {
        display: block;
        text-align: center;
      }

      .study-table td:first-child .speaker {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        margin: 0;
      }

      .column-speaker {
        display: block;
        margin: 3px auto 0;
        font-size: .92rem;
      }

      .speaker:hover,
      .column-speaker:hover {
        background: rgba(215, 233, 225, .7);
      }

      .speaker svg,
      .column-speaker svg {
        display: block;
        width: 18px;
        height: 18px;
      }

      .row-word {
        display: inline;
      }

      .empty-state {
        padding: 28px;
        text-align: center;
        color: var(--sub);
      }

      .app-nav-shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 22px 0;
      }

      .app-navigation {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        white-space: nowrap;
        padding: 4px 2px 9px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .app-navigation .nav-link {
        flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, .85);
        border-radius: 999px;
        padding: 7px 15px;
        background: rgba(255, 255, 255, .62);
        color: var(--ink);
        font: inherit;
        font-size: .9rem;
        cursor: pointer;
      }

      .app-navigation .nav-link.active {
        background: linear-gradient(135deg, #d7e9e1, #f4dcd5);
        font-weight: 700;
      }

      .review-categories {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }

      .review-categories .chip {
        font-size: .84rem;
        padding: 6px 12px;
      }

      .pattern-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
        gap: 12px;
      }

      .pattern-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
        min-height: 120px;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, .88);
        border-radius: 14px;
        background: rgba(255, 255, 255, .62);
        color: var(--ink);
        text-align: left;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(80, 100, 110, .08);
      }

      .pattern-card:hover {
        background: rgba(255, 255, 255, .82);
      }

      .pattern-group,
      .lesson-tags,
      .example-tags {
        color: var(--sub);
        font-size: .82rem;
      }

      .pattern-connect {
        font-size: .9rem;
      }

      .lesson-detail {
        margin-top: 8px;
        padding: 20px;
        border-radius: 14px;
        background: rgba(255, 255, 255, .58);
      }

      .lesson-detail h2 {
        margin: 10px 0 4px;
      }

      .lesson-detail h3 {
        margin: 22px 0 8px;
        font-size: 1.05rem;
      }

      .lesson-detail p {
        margin: 7px 0;
      }

      .back-button {
        margin-bottom: 8px;
      }

      .lesson-connection {
        font-weight: 700;
      }

      .lesson-notes {
        margin: 0 0 18px;
        padding-left: 1.4em;
        color: var(--sub);
        line-height: 1.7;
      }

      .reference-scroll {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .reference-table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 255, 255, .45);
      }

      .reference-table th,
      .reference-table td {
        padding: 10px 12px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .reference-table th {
        background: rgba(220, 235, 228, .72);
        white-space: nowrap;
      }

      .example-list {
        display: grid;
        gap: 10px;
      }

      .example-item {
        padding: 12px 14px;
        border: 1px solid rgba(135, 164, 151, .22);
        border-radius: 10px;
        background: rgba(255, 255, 255, .5);
      }

      .example-japanese {
        font-size: 1.08rem;
      }

      .example-chinese {
        color: var(--sub);
      }

      .example-note,
      .example-source {
        display: block;
        margin-top: 8px;
        color: var(--sub);
        font-size: .86rem;
      }

      .conjugation-table {
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        width: 100%;
        min-width: 520px;
        background: rgba(255, 255, 255, .5);
      }

      .conjugation-table col:first-child {
        width: 48%;
      }

      .conjugation-table col:last-child {
        width: 52%;
      }

      .conjugation-table th,
      .conjugation-table td {
        padding: 14px 12px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        text-align: center;
      }

      .conjugation-table th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: rgba(220, 235, 228, .88);
        font-weight: 700;
      }

      .conjugation-table th:first-child,
      .conjugation-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 3;
        background: rgba(248, 251, 248, .97);
      }

      .conjugation-table th:first-child {
        z-index: 5;
        background: #e1eee8;
      }

      .conjugation-table td:first-child {
        position: sticky;
      }

      .conjugation-table td:first-child .row-word {
        display: block;
        text-align: center;
      }

      .conjugation-table td:first-child .speaker {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        margin: 0;
      }

      .conjugation-table tr:first-child th {
        border-top: 1px solid var(--line);
      }

      .conjugation-table th:first-child,
      .conjugation-table td:first-child {
        border-left: 1px solid var(--line);
      }

      @media(max-width:600px) {
        .study-wrap {
          padding: 18px 12px 34px
        }

        .study-panel {
          padding: 15px 12px
        }

        .category-tabs {
          gap: 6px
        }

        .category-tabs .chip {
          font-size: .78rem;
          padding-left: 8px;
          padding-right: 8px
        }

        .study-table {
        min-width: 1450px
        }

        .study-table col:first-child {
          width: 138px
        }

        .study-table col:not(:first-child) {
          width: 164px
        }

        .study-table th,
        .study-table td {
          padding: 10px 7px;
          font-size: .92rem
        }

        .conjugation-table {
          min-width: 430px
        }

        .conjugation-table th,
        .conjugation-table td {
          padding: 11px 8px;
          font-size: .94rem
        }

        .cell-button {
          min-width: 0;
          width: 100%;
          padding: 8px 3px;
          overflow-wrap: anywhere
        }

        .speaker {
          padding: 6px 3px
        }

        .study-head p {
          font-size: .95rem
        }
      }

      @media(max-width:600px) {
        .app-nav-shell {
          padding: 12px 12px 0
        }

        .app-navigation .nav-link {
          padding: 7px 12px;
          font-size: .84rem
        }

        .lesson-detail {
          padding: 16px 13px
        }

      }
    </style>
  </head>
