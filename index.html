        background-attachment: fixed;
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        line-height: 1.6;
        min-height: 100vh
      }

      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 18px 40px
      }

      h1 {
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Noto Serif TC", serif;
        font-size: 2rem;
        margin: 8px 0 4px;
        letter-spacing: .04em
      }

      p.lead {
        color: var(--ink);
        margin: 0 0 22px
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0 22px
      }

      .chip {
        border: 1px solid rgba(255, 255, 255, .85);
        background: rgba(255, 255, 255, .55);
        color: var(--ink);
        padding: 8px 18px;
        border-radius: 9px;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(90, 110, 120, .12)
      }

      .chip[aria-pressed="true"] {
        border-color: transparent;
        background: linear-gradient(135deg, #f6c3a6, #f3a9b4);
        color: var(--ink);
        font-weight: 500
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--indigo);
        outline-offset: 2px
      }

      .btn {
        background: linear-gradient(135deg, #f6c3a6, #f3a9b4);
        color: var(--ink);
        border: 0;
        border-radius: 9px;
        padding: 12px 26px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(200, 110, 110, .25)
      }

      .btn:active {
        transform: scale(.98)
      }

      .btn.ghost {
        background: rgba(255, 255, 255, .5);
        color: var(--ink);
        border: 1px solid rgba(255, 255, 255, .85);
        box-shadow: none
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--ink);
        font-size: .95rem;
        margin-bottom: 8px
      }

      .bar {
        height: 8px;
        background: rgba(255, 255, 255, .55);
        border-radius: 9px;
        overflow: hidden;
        margin-bottom: 18px
      }

      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #f3b79f, #9fc3d6);
        border-radius: 9px;
        transition: width .3s
      }

      .card,
      #home,
      #end {
        background: color-mix(in srgb, var(--card) 78%, transparent);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);

      .stamp {

      }

      }

      @keyframes press {

      @media (prefers-reduced-motion:reduce) {

      /* 水彩花朵背景搭配：霧藍綠 × 奶油白 × 柔珊瑚 */

      /* Dictionary-form study table */
      .study-wrap { max-width: 1100px; margin: 0 auto; padding: 28px 22px 60px; }

      .cell-button { border:0; background:transparent; color:var(--ink); font:inherit; cursor:pointer; padding:5px 7px; border-radius:8px; min-width:112px; }

      @media(max-width:600px) { .study-wrap{padding:18px 12px 34px}.study-panel{padding:15px 12px}.category-tabs{gap:6px}.category-tabs .chip{font-size:.78rem;padding-left:8px;padding-right:8px}.study-table{min-width:794px}.study-table col:first-child{width:138px}.study-table col:not(:first-child){width:164px}.study-table th,.study-table td{padding:10px 7px;font-size:.92rem}.cell-button{min-width:0;width:100%;padding:8px 3px;overflow-wrap:anywhere}.speaker{padding:6px 3px}.study-head p{font-size:.95rem} }

    <body>
    <main class="study-wrap">
      <header class="study-head">
        <h1>～んです 變形練習</h1>
        
      </header>
      <section class="study-panel" aria-label="～んです變形表">
        <nav class="category-tabs" id="categories" role="tablist" aria-label="文法類別"></nav>
        
        <div class="table-scroll"><table class="study-table">
          <colgroup><col><col><col><col><col></colgroup><thead><tr><th scope="col">辭書形<button class="column-speaker" type="button" data-column="0" aria-label="朗讀辭書形整欄"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></th><th scope="col">～んです<button class="column-speaker" type="button" data-column="1" aria-label="朗讀～んです整欄"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></th><th scope="col">～ないんです<button class="column-speaker" type="button" data-column="2" aria-label="朗讀～ないんです整欄"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></th><th scope="col">～たんです<button class="column-speaker" type="button" data-column="3" aria-label="朗讀～たんです整欄"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></th><th scope="col">～なかったんです<button class="column-speaker" type="button" data-column="4" aria-label="朗讀～なかったんです整欄"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></th></tr></thead>
          <tbody id="tableRows"></tbody>
        </table></div>
      </section>
    </main>
    <script>
      (function () {
        var groups = [
          { id:'verb', label:'動詞', rows:[
            ['行きます','行く','行かない','行った','行かなかった','いきます','いく'],
            ['帰（かえ）ります','帰る','帰らない','帰った','帰らなかった','かえります','かえる'],
            ['見（み）ます','みる','みない','みた','みなかった','みます','みる'],
            ['泳（およ）ぎます','およぐ','およがない','およいだ','およがなかった','およぎます','およぐ'],
            ['飲（の）みます','のむ','のまない','のんだ','のまなかった','のみます','のむ'],
            ['書（か）きます','かく','かかない','かいた','かかなかった','かきます','かく'],
            ['います','いる','いない','いた','いなかった','います','いる'],
            ['待（ま）ちます','まつ','またない','まった','またなかった','まちます','まつ'],
            ['寝（ね）ます','ねる','ねない','ねた','ねなかった','ねます','ねる'],
            ['遊（あそ）びます','あそぶ','あそばない','あそんだ','あそばなかった','あそびます','あそぶ'],
            ['聞（き）きます','きく','きかない','きいた','きかなかった','ききます','きく'],
            ['食（た）べます','たべる','たべない','たべた','たべなかった','たべます','たべる'],
            ['話（はな）します','はなす','はなさない','はなした','はなさなかった','はなします','はなす'],
            ['会（あ）います','あう','あわない','あった','あわなかった','あいます','あう'],
            ['します','する','しない','した','しなかった','します','する'],
            ['来（き）ます','くる','こない','きた','こなかった','きます','くる']
          ]},
          { id:'special', label:'あります・特例', rows:[['あります','ある','ない','あった','なかった','あります','ある']] },
          { id:'iadj', label:'い形容詞', rows:[
            ['ほしいです','ほしい','ほしくない','ほしかった','ほしくなかった','ほしいです','ほしい'],
            ['食（た）べたいです','たべたい','たべたくない','たべたかった','たべたくなかった','たべたいです','たべたい'],
            ['いいです','いい','よくない','よかった','よくなかった','いいです','いい'],
            ['小さいです','ちいさい','ちいさくない','ちいさかった','ちいさくなかった','ちいさいです','ちいさい']
          ]},
          { id:'naadj', label:'な形容詞', rows:[
            ['綺麗（きれい）です','きれい','きれいじゃない','きれいだった','きれいじゃなかった','きれいです','きれい'],
            ['静かです','しずか','しずかじゃない','しずかだった','しずかじゃなかった','しずかです','しずか'],
            ['暇（ひま）です','ひま','ひまじゃない','ひまだった','ひまじゃなかった','ひまです','ひま']
          ]}
        ];
        var active = groups[0];
        function japaneseUtterance(text) {
          var utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ja-JP'; utterance.rate = 0.94; utterance.pitch = 1;
          var voices = window.speechSynthesis.getVoices();
          var japaneseVoices = voices.filter(function (voice) { return /^ja(-|$)/i.test(voice.lang); });
          japaneseVoices.sort(function (a, b) {
            var score = function (voice) { return (voice.lang.toLowerCase() === 'ja-jp' ? 2 : 0) + (voice.localService ? 1 : 0); };
            return score(b) - score(a);
          });
          if (japaneseVoices.length) utterance.voice = japaneseVoices[0];
          return utterance;
        }
        function speak(text) {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(japaneseUtterance(text));
        }
        function speakList(items) {
          if (!('speechSynthesis' in window) || !items.length) return;
          window.speechSynthesis.cancel();
          items.forEach(function (text) { window.speechSynthesis.speak(japaneseUtterance(text)); });
        }
        function speakThen(dictionaryForm, conjugatedForm) {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          [dictionaryForm, conjugatedForm].forEach(function (text) {
            window.speechSynthesis.speak(japaneseUtterance(text));
          });
        }
        function button(text, label, handler, extra) {
          var b=document.createElement('button'); b.type='button'; b.className=extra||'cell-button';
          if (extra === 'speaker') b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
          else b.textContent=text;
          b.setAttribute('aria-label',label); if (typeof handler === 'function') b.addEventListener('click',handler); return b;
        }
        function renderTabs() {
          var nav=document.getElementById('categories'); nav.innerHTML='';
          groups.forEach(function(g) {
            var b=button(g.label,g.label,function(){active=g; render();},'chip');
            b.setAttribute('role','tab'); b.setAttribute('aria-selected',g===active?'true':'false'); b.setAttribute('aria-pressed',g===active?'true':'false'); nav.appendChild(b);
          });
        }
        function render() {
          renderTabs(); var tbody=document.getElementById('tableRows'); tbody.innerHTML='';
          active.rows.forEach(function(row) {
            var tr=document.createElement('tr'), base=document.createElement('td');
            var word=document.createElement('span'); word.className='row-word'; word.textContent=row[6]; base.appendChild(word);
            var audio=button('🔊','播放 '+row[6],function(){speak(row[6]);},'speaker'); base.appendChild(audio); tr.appendChild(base);
            for(var i=1;i<=4;i++) {
              var td=document.createElement('td'), form=row[i]+'んです';
              var cell=button('','','', 'cell-button');
              cell.setAttribute('aria-label','顯示並播放變形'); cell.innerHTML='<span class="masked">點一下顯示</span>';
              cell.addEventListener('click',function(target,btn){return function(){btn.textContent=target; btn.setAttribute('aria-label','播放 '+target); btn.onclick=function(){speak(target);}; speakThen(row[6], target);};}(form,cell));
              td.appendChild(cell); tr.appendChild(td);
            }
            tbody.appendChild(tr);
          });
        }
        document.querySelectorAll('.column-speaker').forEach(function (control) {
          control.addEventListener('click', function () {
            var column = Number(control.dataset.column);
            var items = [];
            active.rows.forEach(function (row) {
              if (column === 0) items.push(row[6]);
              else items.push(row[6], row[column] + 'んです');
            });
            speakList(items);
          });
        });
        render();
      })();
    </script>
