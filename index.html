<!DOCTYPE html>
<html lang="zh-Hant">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>日文文法筆記</title>
    <link rel="icon" type="image/png" href="Japanese/grammar-icon.png">
    <link rel="apple-touch-icon" href="Japanese/grammar-icon.png">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
    <link rel="stylesheet" href="Japanese/styles.css">
  </head>

  <body>
    <div class="app-nav-shell">
      <nav class="app-navigation" id="app-navigation" aria-label="日文文法筆記導覽">
        <button class="nav-link active" type="button" data-app-page="ndesu" aria-current="page">詞性與變化</button>
        <button class="nav-link" type="button" data-app-page="grammar" aria-current="false">文法重點</button>
        <button class="nav-link" type="button" data-app-page="examples" aria-current="false">例句</button>
      </nav>
    </div>
    <div class="data-status study-wrap" id="data-status" role="status" aria-live="polite">正在讀取雲端筆記…</div>
    <main class="study-wrap" id="ndesu-view">
      <header class="study-head">
        <h1 id="study-heading">動詞基礎變化</h1>

      </header>
      <nav class="category-tabs" id="study-modes" role="tablist" aria-label="內容類型">
        <button class="chip" type="button" role="tab" aria-selected="true" aria-pressed="true"
          data-study-mode="conjugation">基礎變化</button>
        <button class="chip" type="button" role="tab" aria-selected="false" aria-pressed="false"
          data-study-mode="ndesu">んです</button>
      </nav>
      <section class="study-panel" aria-label="動詞基礎變化表" hidden>
        <nav class="category-tabs" id="categories" role="tablist" aria-label="文法類別"></nav>

        <div class="table-scroll">
          <table class="study-table">
            <colgroup>
              <col>
              <col>
              <col>
              <col>
              <col>
            </colgroup>
            <thead>
              <tr>
                <th scope="col">辭書形<button class="column-speaker" type="button" data-column="0"
                    aria-label="朗讀辭書形整欄"><svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" />
                      <path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" />
                    </svg></button></th>
                <th scope="col">～んです<button class="column-speaker" type="button" data-column="1"
                    aria-label="朗讀～んです整欄"><svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" />
                      <path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" />
                    </svg></button></th>
                <th scope="col">～ないんです<button class="column-speaker" type="button" data-column="2"
                    aria-label="朗讀～ないんです整欄"><svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" />
                      <path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" />
                    </svg></button></th>
                <th scope="col">～たんです<button class="column-speaker" type="button" data-column="3"
                    aria-label="朗讀～たんです整欄"><svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" />
                      <path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" />
                    </svg></button></th>
                <th scope="col">～なかったんです<button class="column-speaker" type="button" data-column="4"
                    aria-label="朗讀～なかったんです整欄"><svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" />
                      <path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" />
                    </svg></button></th>
              </tr>
            </thead>
            <tbody id="tableRows"></tbody>
          </table>
        </div>
      </section>
      <section class="study-panel" id="conjugation-panel" aria-label="動詞基礎變化表" hidden>
        <div id="conjugation-content"></div>
      </section>
    </main>
    <main class="study-wrap" id="review-view" hidden>
      <header class="study-head">
        <h1 id="review-heading">文法筆記</h1>
      </header>
      <section class="study-panel">
        <div id="review-content"></div>
      </section>
    </main>
    <script src="Japanese/app-config.js"></script>
    <script src="Japanese/data-source.js"></script>
    <script src="Japanese/app.js"></script>
  </body>

</html>
