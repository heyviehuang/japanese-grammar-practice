<!DOCTYPE html>
<html lang="zh-Hant">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>日文文法複習系統</title>
    <link rel="icon" type="image/png" href="Japanese/grammar-icon.png">
    <link rel="apple-touch-icon" href="Japanese/grammar-icon.png">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
    <style>
      :root {
        color-scheme: light;
        --paper: #e8efec;
        --card: #f8fbf8;
        --ink: #26352f;
        --sub: #566960;
        --line: #d7e3dd;
        --indigo: #6d9188;
        --seal: #c98279;
        --ok: #5c907b;
        --w1: #f8d6d6;
        --w2: #fbe3c4;
        --w3: #e2dcf3;
        --veil: rgba(223, 234, 230, .20);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px)
      }


      *,
      *::before,
      *::after {
        box-sizing: inherit
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px)
      }

      body {
        margin: 0;
        background: linear-gradient(var(--veil), var(--veil)), url('https://i.pinimg.com/736x/65/69/4f/65694f7cabaa8c0e73f5e8ad018c48cc.jpg') center/cover no-repeat var(--paper);
        background-attachment: fixed;
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        line-height: 1.6;
        min-height: 100vh
      }

      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 18px 40px
      }

      h1 {
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Noto Serif TC", serif;
        font-size: 2rem;
        margin: 8px 0 4px;
        letter-spacing: .04em
      }

      p.lead {
        color: var(--ink);
        margin: 0 0 22px
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0 22px
      }

      .chip {
        border: 1px solid rgba(255, 255, 255, .85);
        background: rgba(255, 255, 255, .55);
        color: var(--ink);
        padding: 8px 18px;
        border-radius: 9px;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(90, 110, 120, .12)
      }

      .chip[aria-pressed="true"] {
        border-color: transparent;
        background: linear-gradient(135deg, #f6c3a6, #f3a9b4);
        color: var(--ink);
        font-weight: 500
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--indigo);
        outline-offset: 2px
      }

      .btn {
        background: linear-gradient(135deg, #f6c3a6, #f3a9b4);
        color: var(--ink);
        border: 0;
        border-radius: 9px;
        padding: 12px 26px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(200, 110, 110, .25)
      }

      .btn:active {
        transform: scale(.98)
      }

      .btn.ghost {
        background: rgba(255, 255, 255, .5);
        color: var(--ink);
        border: 1px solid rgba(255, 255, 255, .85);
        box-shadow: none
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--ink);
        font-size: .95rem;
        margin-bottom: 8px
      }

      .bar {
        height: 8px;
        background: rgba(255, 255, 255, .55);
        border-radius: 9px;
        overflow: hidden;
        margin-bottom: 18px
      }

      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #f3b79f, #9fc3d6);
        border-radius: 9px;
        transition: width .3s
      }

      .card,
      #home,
      #end {
        background: color-mix(in srgb, var(--card) 78%, transparent);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, .7);
        border-radius: 9px;
        padding: 24px 22px;
        position: relative;
        box-shadow: 0 10px 32px rgba(80, 100, 110, .16)
      }

      .word {
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Noto Serif TC", serif;
        font-size: 2.6rem;
        font-weight: 700;
        line-height: 1.2;
        margin: 0
      }

      .kana {
        color: var(--sub);
        margin: 2px 0 0
      }

      .mean {
        color: var(--sub);
        font-size: .95rem
      }

      .target {
        margin: 16px 0 12px;
        font-size: 1.1rem
      }

      .target b {
        background: linear-gradient(transparent 58%, rgba(246, 180, 150, .7) 58%);
        padding: 0 2px
      }

      .row {
        display: flex;
        gap: 8px
      }

      input[type=text] {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 1.3rem;
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, .9);
        border-radius: 9px;
        background: rgba(255, 255, 255, .7);
        box-shadow: inset 0 1px 4px rgba(90, 110, 120, .14);
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif
      }

      .fb {
        margin-top: 16px;
        display: none
      }

      .fb.show {
        display: block
      }

      .stamp {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 64px;
        height: 60px;
        background: rgba(240, 160, 140, .75);
        color: #7a2a1e;
        border-radius: 58% 42% 55% 45%/50% 55% 45% 50%;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 1.2rem;
        transform: rotate(-10deg)
      }

      .stamp.ok {
        background: rgba(160, 208, 184, .8);
        color: #1d5a40
      }

      .stamp.show {
        display: flex;
        animation: press .18s ease-out
      }

      @keyframes press {
        from {
          transform: rotate(-10deg) scale(1.7);
          opacity: 0
        }

        to {
          transform: rotate(-10deg) scale(1);
          opacity: 1
        }
      }

      .ans {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 4px
      }

      .rule {
        color: var(--sub);
        margin: 0 0 12px
      }

      .big {
        font-family: "Shippori Mincho", serif;
        font-size: 3.2rem;
        font-weight: 700;
        margin: 6px 0
      }

      .rev {
        list-style: none;
        padding: 0;
        margin: 14px 0
      }

      .rev li {
        padding: 10px 0;
        border-top: 1px solid var(--line)
      }

      .rev small {
        color: var(--sub);
        display: block
      }

      .shake {
        animation: sh .3s
      }

      @keyframes sh {
        25% {
          transform: translateX(-6px)
        }

        75% {
          transform: translateX(6px)
        }
      }

      @media (prefers-reduced-motion:reduce) {

        .stamp.show,
        .shake {
          animation: none
        }

        .bar i {
          transition: none
        }
      }



      /* 水彩花朵背景搭配：霧藍綠 × 奶油白 × 柔珊瑚 */
      main {
        max-width: 560px;
        padding: 34px 20px 48px;
      }

      h1 {
        color: #263f36;
        font-size: clamp(1.75rem, 5vw, 2.1rem);
        letter-spacing: .07em;
      }

      p.lead {
        color: #465d53;
      }

      #home,
      #end,
      .card {
        background: rgba(250, 253, 250, .78);
        border: 1px solid rgba(255, 255, 255, .82);
        border-radius: 22px;
        box-shadow: 0 16px 42px rgba(71, 103, 93, .13), inset 0 1px 0 rgba(255, 255, 255, .72);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }

      #home,
      #end {
        padding: 28px 26px;
      }

      .chip {
        border: 1px solid rgba(255, 255, 255, .9);
        background: rgba(249, 252, 249, .72);
        color: #344b40;
        border-radius: 999px;
        padding: 9px 17px;
        box-shadow: 0 3px 12px rgba(75, 110, 99, .08);
        transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      }

      .chip:hover {
        transform: none;
      }

      .chip[aria-pressed="true"] {
        background: linear-gradient(135deg, #d7e9e1, #f4dcd5);
        color: #263f36;
        border-color: rgba(255, 255, 255, .9);
        box-shadow: 0 5px 14px rgba(103, 145, 130, .16);
      }

      .btn {
        border-radius: 999px;
        padding: 11px 24px;
        color: #293f35;
        background: linear-gradient(135deg, #d7e9e1, #f1d9d2);
        box-shadow: 0 6px 16px rgba(104, 145, 130, .17);
        transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(104, 145, 130, .22);
        filter: saturate(1.04);
      }

      .btn:active {
        transform: translateY(0) scale(.98);
      }

      .btn.ghost {
        background: rgba(255, 255, 255, .72);
        color: #40584d;
        border-color: rgba(255, 255, 255, .9);
      }

      .hud {
        color: #3d554a;
        font-size: .9rem;
      }

      .bar {
        height: 7px;
        background: rgba(255, 255, 255, .72);
        border-radius: 99px;
      }

      .bar i {
        background: linear-gradient(90deg, #a9cdbd, #e9bdb2);
        border-radius: 99px;
      }

      .word {
        color: #263f36;
      }

      .kana,
      .mean {
        color: #596d63;
      }

      .target b {
        background: linear-gradient(transparent 60%, rgba(225, 190, 177, .62) 60%);
      }

      input[type=text] {
        border: 1px solid rgba(255, 255, 255, .96);
        border-radius: 14px;
        background: rgba(255, 255, 255, .78);
        box-shadow: inset 0 1px 4px rgba(80, 115, 102, .08);
      }

      input[type=text]:focus {
        border-color: #a7c8b9;
        background: rgba(255, 255, 255, .94);
      }

      .stamp {
        background: rgba(231, 190, 178, .9);
        color: #87564c;
        transform: rotate(-7deg);
      }

      .stamp.ok {
        background: rgba(182, 215, 198, .94);
        color: #426c59;
      }

      .stamp.show {
        animation: press .18s ease-out;
      }

      .ans {
        color: #456258;
      }

      .rule {
        color: #596d63;
      }

      .rev li {
        border-color: rgba(135, 164, 151, .22);
      }

      .rev small {
        color: #596d63;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(109, 145, 136, .55);
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        main {
          padding: 22px 14px 34px;
        }

        #home,
        #end,
        .card {
          padding: 22px 18px;
          border-radius: 19px;
        }

        .row {
          align-items: stretch;
        }

        .row .btn {
          padding-left: 18px;
          padding-right: 18px;
        }
      }

      [hidden] {
        display: none !important
      }

      /* Dictionary-form study table */
      .study-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 22px 60px;
      }

      .study-head {
        margin: 14px 0 24px;
      }

      .study-head h1 {
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }

      .study-head p {
        color: var(--sub);
        margin: 8px 0 0;
      }

      .study-panel {
        background: color-mix(in srgb, var(--card) 86%, transparent);
        border: 1px solid rgba(255, 255, 255, .8);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 10px 32px rgba(80, 100, 110, .12);
      }

      .category-title {
        font-size: 1.05rem;
        margin: 0 0 10px;
        color: var(--ink);
      }

      .category-tabs {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        margin-bottom: 18px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x;
        scrollbar-width: none;
      }

      .category-tabs::-webkit-scrollbar {
        display: none;
      }

      .category-tabs .chip {
        flex: 0 0 auto;
      }

      .category-tabs .chip {
        border-radius: 999px;
        color: #344b40;
        font-weight: 700;
        font-size: .88rem;
        padding: 6px 12px;
        white-space: nowrap;
      }

      .table-note {
        color: var(--sub);
        font-size: .92rem;
        margin: 0 0 14px;
      }

      .table-scroll {
        display: block;
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        border-radius: 14px;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
        scrollbar-width: thin;
        scrollbar-color: #9bb9aa transparent;
      }

      .study-table {
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        width: 100%;
        min-width: 890px;
        background: rgba(255, 255, 255, .5);
      }

      .study-table col:first-child {
        width: 170px;
      }

      .study-table col:not(:first-child) {
        width: 180px;
      }

      .study-table th,
      .study-table td {
        padding: 12px 10px;
        text-align: center;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .study-table th {
        background: rgba(220, 235, 228, .72);
        font-weight: 700;
        white-space: normal;
        line-height: 1.35;
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .study-table th:first-child,
      .study-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        background: rgba(248, 251, 248, .97);
        text-align: center;
        min-width: 150px;
      }

      .study-table th:first-child {
        z-index: 5;
        position: sticky;
        left: 0;
        background: #e1eee8;
      }

      .study-table td:first-child {
        z-index: 3;
      }

      .study-table tr:first-child th {
        border-top: 1px solid var(--line);
      }

      .study-table th:first-child,
      .study-table td:first-child {
        border-left: 1px solid var(--line);
      }

      .cell-button {
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        padding: 5px 7px;
        border-radius: 8px;
        min-width: 112px;
      }

      .cell-button:hover {
        background: rgba(215, 233, 225, .7);
      }

      .cell-button .masked {
        color: #84938b;
        letter-spacing: .08em;
      }

      .speaker,
      .column-speaker {
        border: 0;
        background: transparent;
        color: var(--indigo);
        font: inherit;
        cursor: pointer;
        padding: 4px 7px;
        margin-left: 3px;
        border-radius: 8px;
      }

      .study-table td:first-child {
        position: sticky;
      }

      .study-table td:first-child .row-word {
        display: block;
        text-align: center;
      }

      .study-table td:first-child .speaker {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        margin: 0;
      }

      .column-speaker {
        display: block;
        margin: 3px auto 0;
        font-size: .92rem;
      }

      .speaker:hover,
      .column-speaker:hover {
        background: rgba(215, 233, 225, .7);
      }

      .speaker svg,
      .column-speaker svg {
        display: block;
        width: 18px;
        height: 18px;
      }

      .row-word {
        display: inline;
      }

      .empty-state {
        padding: 28px;
        text-align: center;
        color: var(--sub);
      }

      .app-nav-shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 22px 0;
      }

      .app-navigation {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        white-space: nowrap;
        padding: 4px 2px 9px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .app-navigation .nav-link {
        flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, .85);
        border-radius: 999px;
        padding: 7px 15px;
        background: rgba(255, 255, 255, .62);
        color: var(--ink);
        font: inherit;
        font-size: .9rem;
        cursor: pointer;
      }

      .app-navigation .nav-link.active {
        background: linear-gradient(135deg, #d7e9e1, #f4dcd5);
        font-weight: 700;
      }

      .review-categories {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }

      .review-categories .chip {
        font-size: .84rem;
        padding: 6px 12px;
      }

      .pattern-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
        gap: 12px;
      }

      .pattern-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
        min-height: 120px;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, .88);
        border-radius: 14px;
        background: rgba(255, 255, 255, .62);
        color: var(--ink);
        text-align: left;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(80, 100, 110, .08);
      }

      .pattern-card:hover {
        background: rgba(255, 255, 255, .82);
      }

      .pattern-group,
      .lesson-tags,
      .example-tags {
        color: var(--sub);
        font-size: .82rem;
      }

      .pattern-connect {
        font-size: .9rem;
      }

      .lesson-detail {
        margin-top: 8px;
        padding: 20px;
        border-radius: 14px;
        background: rgba(255, 255, 255, .58);
      }

      .lesson-detail h2 {
        margin: 10px 0 4px;
      }

      .lesson-detail h3 {
        margin: 22px 0 8px;
        font-size: 1.05rem;
      }

      .lesson-detail p {
        margin: 7px 0;
      }

      .back-button {
        margin-bottom: 8px;
      }

      .lesson-connection {
        font-weight: 700;
      }

      .reference-scroll {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .reference-table,
      .progress-table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 255, 255, .45);
      }

      .reference-table th,
      .reference-table td,
      .progress-table th,
      .progress-table td {
        padding: 10px 12px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .reference-table th,
      .progress-table th {
        background: rgba(220, 235, 228, .72);
        white-space: nowrap;
      }

      .example-list {
        display: grid;
        gap: 10px;
      }

      .example-item {
        padding: 12px 14px;
        border: 1px solid rgba(135, 164, 151, .22);
        border-radius: 10px;
        background: rgba(255, 255, 255, .5);
      }

      .example-japanese {
        font-size: 1.08rem;
      }

      .example-chinese {
        color: var(--sub);
      }

      .lesson-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 20px;
      }

      .exercise-setup {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 14px;
        align-items: end;
      }

      .field-label {
        display: grid;
        gap: 6px;
        color: var(--sub);
        font-size: .9rem;
      }

      .field-control {
        width: 100%;
        min-height: 44px;
        padding: 9px 11px;
        border: 1px solid rgba(135, 164, 151, .48);
        border-radius: 10px;
        background: rgba(255, 255, 255, .82);
        color: var(--ink);
        font: inherit;
      }

      .exercise-setup .btn {
        justify-self: start;
      }

      .question-panel {
        max-width: 760px;
        margin: 0 auto;
      }

      .question-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--sub);
        font-size: .9rem;
      }

      .question-prompt {
        margin: 20px 0;
        line-height: 1.55;
      }

      .choice-list {
        display: grid;
        gap: 10px;
      }

      .choice-button {
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, .72);
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .choice-button:hover {
        background: rgba(215, 233, 225, .7);
      }

      .answer-form {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .answer-input {
        flex: 1 1 220px;
      }

      .answer-feedback {
        font-weight: 700;
        font-size: 1.15rem;
      }

      .answer-feedback.correct {
        color: #477d65;
      }

      .answer-feedback.incorrect {
        color: #a75e55;
      }

      .correct-answer {
        font-weight: 700;
      }

      .result-score {
        font-size: 1.4rem;
        font-weight: 700;
      }

      .progress-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .progress-card {

    <script>
      (function () {
        var groups = [
          {
            id: 'verb', label: '動詞', rows: [
              ['行きます', '行く', '行かない', '行った', '行かなかった', 'いきます', 'いく'],
              ['帰（かえ）ります', '帰る', '帰らない', '帰った', '帰らなかった', 'かえります', 'かえる'],
              ['見（み）ます', 'みる', 'みない', 'みた', 'みなかった', 'みます', 'みる'],
              ['泳（およ）ぎます', 'およぐ', 'およがない', 'およいだ', 'およがなかった', 'およぎます', 'およぐ'],
              ['飲（の）みます', 'のむ', 'のまない', 'のんだ', 'のまなかった', 'のみます', 'のむ'],
              ['書（か）きます', 'かく', 'かかない', 'かいた', 'かかなかった', 'かきます', 'かく'],
              ['います', 'いる', 'いない', 'いた', 'いなかった', 'います', 'いる'],
              ['待（ま）ちます', 'まつ', 'またない', 'まった', 'またなかった', 'まちます', 'まつ'],
              ['寝（ね）ます', 'ねる', 'ねない', 'ねた', 'ねなかった', 'ねます', 'ねる'],
              ['遊（あそ）びます', 'あそぶ', 'あそばない', 'あそんだ', 'あそばなかった', 'あそびます', 'あそぶ'],
              ['聞（き）きます', 'きく', 'きかない', 'きいた', 'きかなかった', 'ききます', 'きく'],
              ['食（た）べます', 'たべる', 'たべない', 'たべた', 'たべなかった', 'たべます', 'たべる'],
              ['話（はな）します', 'はなす', 'はなさない', 'はなした', 'はなさなかった', 'はなします', 'はなす'],
              ['会（あ）います', 'あう', 'あわない', 'あった', 'あわなかった', 'あいます', 'あう'],
              ['します', 'する', 'しない', 'した', 'しなかった', 'します', 'する'],
              ['来（き）ます', 'くる', 'こない', 'きた', 'こなかった', 'きます', 'くる']
            ]
          },
          { id: 'special', label: 'あります・特例', rows: [['あります', 'ある', 'ない', 'あった', 'なかった', 'あります', 'ある']] },
          {
            id: 'iadj', label: 'い形容詞', rows: [
              ['ほしいです', 'ほしい', 'ほしくない', 'ほしかった', 'ほしくなかった', 'ほしいです', 'ほしい'],
              ['食（た）べたいです', 'たべたい', 'たべたくない', 'たべたかった', 'たべたくなかった', 'たべたいです', 'たべたい'],
              ['いいです', 'いい', 'よくない', 'よかった', 'よくなかった', 'いいです', 'いい'],
              ['小さいです', 'ちいさい', 'ちいさくない', 'ちいさかった', 'ちいさくなかった', 'ちいさいです', 'ちいさい']
            ]
          },
          {
            id: 'naadj', label: 'な形容詞', rows: [
              ['綺麗（きれい）です', 'きれい', 'きれいじゃない', 'きれいだった', 'きれいじゃなかった', 'きれいです', 'きれい'],
              ['静かです', 'しずか', 'しずかじゃない', 'しずかだった', 'しずかじゃなかった', 'しずかです', 'しずか'],
              ['暇（ひま）です', 'ひま', 'ひまじゃない', 'ひまだった', 'ひまじゃなかった', 'ひまです', 'ひま']
            ]
          }
        ];
        var active = groups[0];
        function japaneseUtterance(text) {
          var utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ja-JP'; utterance.rate = 0.94; utterance.pitch = 1;
          var voices = window.speechSynthesis.getVoices();
          var japaneseVoices = voices.filter(function (voice) { return /^ja(-|$)/i.test(voice.lang); });
          japaneseVoices.sort(function (a, b) {
            var score = function (voice) { return (voice.lang.toLowerCase() === 'ja-jp' ? 2 : 0) + (voice.localService ? 1 : 0); };
            return score(b) - score(a);
          });
          if (japaneseVoices.length) utterance.voice = japaneseVoices[0];
          return utterance;
        }
        function speak(text) {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(japaneseUtterance(text));
        }
        function speakList(items) {
          if (!('speechSynthesis' in window) || !items.length) return;
          window.speechSynthesis.cancel();
          items.forEach(function (text) { window.speechSynthesis.speak(japaneseUtterance(text)); });
        }
        function speakThen(dictionaryForm, conjugatedForm) {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          [dictionaryForm, conjugatedForm].forEach(function (text) {
            window.speechSynthesis.speak(japaneseUtterance(text));
          });
        }
        function button(text, label, handler, extra) {
          var b = document.createElement('button'); b.type = 'button'; b.className = extra || 'cell-button';
          if (extra === 'speaker') b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
          else b.textContent = text;
          b.setAttribute('aria-label', label); if (typeof handler === 'function') b.addEventListener('click', handler); return b;
        }
        function renderTabs() {
          var nav = document.getElementById('categories'); nav.innerHTML = '';
          groups.forEach(function (g) {
            var b = button(g.label, g.label, function () { active = g; render(); }, 'chip');
            b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', g === active ? 'true' : 'false'); b.setAttribute('aria-pressed', g === active ? 'true' : 'false'); nav.appendChild(b);
          });
        }
        function render() {
          renderTabs(); var tbody = document.getElementById('tableRows'); tbody.innerHTML = '';
          active.rows.forEach(function (row) {
            var tr = document.createElement('tr'), base = document.createElement('td');
            var word = document.createElement('span'); word.className = 'row-word'; word.textContent = row[6]; base.appendChild(word);
            var audio = button('🔊', '播放 ' + row[6], function () { speak(row[6]); }, 'speaker'); base.appendChild(audio); tr.appendChild(base);
            for (var i = 1; i <= 4; i++) {
              var td = document.createElement('td'), form = row[i] + 'んです';
              var cell = button('', '', '', 'cell-button');
              cell.setAttribute('aria-label', '顯示並播放變形'); cell.innerHTML = '<span class="masked">點一下顯示</span>';
              cell.addEventListener('click', function (target, btn) { return function () { btn.textContent = target; btn.setAttribute('aria-label', '播放 ' + target); btn.onclick = function () { speak(target); }; speakThen(row[6], target); }; }(form, cell));
              td.appendChild(cell); tr.appendChild(td);
            }
            tbody.appendChild(tr);
          });
        }
        document.querySelectorAll('.column-speaker').forEach(function (control) {
          control.addEventListener('click', function () {
            var column = Number(control.dataset.column);
            var items = [];
            active.rows.forEach(function (row) {
              if (column === 0) items.push(row[6]);
              else items.push(row[6], row[column] + 'んです');
            });
            speakList(items);
          });
        });
        render();
      })();
    </script>
